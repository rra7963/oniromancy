<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body_zephyr" x1="50" y1="130" x2="150" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="head_zephyr" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 95) scale(35)">
      <stop stop-color="#D1FAE5" />
      <stop offset="1" stop-color="#6EE7B7" />
    </radialGradient>
    <filter id="shadow_zephyr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Swirls Background -->
  <path d="M40 70 Q10 100 40 130" stroke="#6EE7B7" stroke-width="3" fill="none" opacity="0.5" />
  <path d="M160 70 Q190 100 160 130" stroke="#6EE7B7" stroke-width="3" fill="none" opacity="0.5" />

  <!-- Body -->
  <path d="M60 200 C60 160 70 140 100 140 C130 140 140 160 140 200" fill="url(#body_zephyr)" filter="url(#shadow_zephyr)" />
  
  <!-- Scarf/Wind -->
  <path d="M70 140 C50 130 50 110 70 120 C90 130 110 130 130 120 C150 110 150 130 130 140" stroke="#A7F3D0" stroke-width="10" fill="none" stroke-linecap="round" />

  <!-- Head -->
  <circle cx="100" cy="95" r="35" fill="url(#head_zephyr)" filter="url(#shadow_zephyr)" />
  
  <!-- Wild Hair -->
  <path d="M65 95 C60 50 80 20 100 20 C120 20 140 50 135 95" fill="#059669" opacity="0.8" />
  <path d="M90 25 C110 10 130 20 150 40" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" />
  <path d="M110 25 C90 10 70 20 50 40" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" />
  
  <!-- Eyes (Mischievous/Wink?) -->
  <circle cx="88" cy="95" r="3" fill="#064E3B" /> <!-- Left Eye Open -->
  <path d="M108 96 L116 94" stroke="#064E3B" stroke-width="2" /> <!-- Right Eye Winking -->
  
  <!-- Smirk -->
  <path d="M92 110 Q100 115 105 108" stroke="#064E3B" stroke-width="2" fill="none" />

</svg>