<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin_luna" x1="100" y1="60" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE4E6" />
      <stop offset="1" stop-color="#FDA4AF" />
    </linearGradient>
    <linearGradient id="hair_luna" x1="50" y1="50" x2="150" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899" />
      <stop offset="1" stop-color="#BE185D" />
    </linearGradient>
    <filter id="shadow_luna" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Back Hair -->
  <path d="M60 200 C60 100 80 50 100 50 C120 50 140 100 140 200" fill="url(#hair_luna)" />
  
  <!-- Shoulders -->
  <path d="M50 200 C60 160 80 150 100 150 C120 150 140 160 150 200" fill="#F43F5E" />
  
  <!-- Head -->
  <circle cx="100" cy="95" r="35" fill="url(#skin_luna)" filter="url(#shadow_luna)" />
  
  <!-- Front Hair/Bangs -->
  <path d="M65 95 C65 60 80 50 100 50 C120 50 135 60 135 95" fill="none" stroke="#BE185D" stroke-width="8" stroke-linecap="round" />
  
  <!-- Eyes -->
  <circle cx="85" cy="95" r="3" fill="#881337" />
  <circle cx="115" cy="95" r="3" fill="#881337" />
  <path d="M82 90 Q85 88 88 90" stroke="#881337" stroke-width="1" fill="none" />
  <path d="M112 90 Q115 88 118 90" stroke="#881337" stroke-width="1" fill="none" />
  
  <!-- Moon Mark -->
  <path d="M100 70 C98 70 96 72 96 75 C96 78 98 80 100 80 C102 80 104 78 104 75 C104 72 102 70 100 70 Z" fill="#FCE7F3" />
  
  <!-- Flowers -->
  <circle cx="65" cy="85" r="6" fill="#FBCFE8" stroke="#DB2777" stroke-width="1" />
  <circle cx="135" cy="85" r="6" fill="#FBCFE8" stroke="#DB2777" stroke-width="1" />

  <!-- Mouth (Added) -->
  <path d="M92 110 Q100 115 108 110" stroke="#881337" stroke-width="1.5" fill="none" opacity="0.6" />

</svg>