<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin_sera" x1="100" y1="60" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED" />
      <stop offset="1" stop-color="#FFEDD5" />
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 85) scale(60)">
      <stop stop-color="#FDE68A" stop-opacity="0.6" />
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_sera" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wings (Abstract) -->
  <path d="M40 80 Q20 50 40 120" stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF" fill-opacity="0.4" />
  <path d="M160 80 Q180 50 160 120" stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF" fill-opacity="0.4" />

  <!-- Aura -->
  <circle cx="100" cy="85" r="50" fill="url(#halo)" />

  <!-- Robe -->
  <path d="M50 200 C50 150 70 140 100 140 C130 140 150 150 150 200" fill="#F3F4F6" filter="url(#shadow_sera)" />
  <path d="M90 140 L100 160 L110 140" fill="#FCD34D" /> <!-- Gold Necklace -->

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="30" ry="36" fill="url(#skin_sera)" filter="url(#shadow_sera)" />

  <!-- Hair (Flowing Gold) -->
  <path d="M65 100 C60 60 70 40 100 40 C130 40 140 60 135 100" fill="none" stroke="#FCD34D" stroke-width="4" opacity="0.8" />
  <path d="M60 100 Q50 140 70 180" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M140 100 Q150 140 130 180" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Eyes (Gentle) -->
  <path d="M85 95 Q90 92 95 95" stroke="#D97706" stroke-width="1.5" fill="none" />
  <path d="M105 95 Q110 92 115 95" stroke="#D97706" stroke-width="1.5" fill="none" />

  <!-- Mouth (Added) -->
  <path d="M92 110 Q100 113 108 110" stroke="#D97706" stroke-width="1.5" fill="none" opacity="0.5" />

</svg>