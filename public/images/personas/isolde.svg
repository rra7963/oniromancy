<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin_isolde" x1="100" y1="60" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE6D0" />
      <stop offset="1" stop-color="#D4A786" />
    </linearGradient>
    <radialGradient id="hair_isolde" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 80) scale(60)">
      <stop stop-color="#3F2E23" />
      <stop offset="1" stop-color="#241812" />
    </radialGradient>
    <filter id="shadow_isolde" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Hair Back -->
  <path d="M50 200 C50 120 40 80 100 50 C160 80 150 120 150 200" fill="#2F4F4F" />
  <!-- Shoulders -->
  <path d="M40 200 C40 160 60 150 100 150 C140 150 160 160 160 200" fill="#228B22" filter="url(#shadow_isolde)" />
  <!-- Head -->
  <ellipse cx="100" cy="95" rx="32" ry="38" fill="url(#skin_isolde)" filter="url(#shadow_isolde)" />
  
  <!-- Hair Front/Vines -->
  <path d="M68 95 C68 60 80 40 100 40 C120 40 132 60 132 95" fill="none" stroke="#2F4F4F" stroke-width="6" />
  
  <!-- Eyes (Open, Earthy) -->
  <circle cx="88" cy="95" r="3" fill="#3F2E23" />
  <circle cx="112" cy="95" r="3" fill="#3F2E23" />
  <path d="M85 92 Q88 88 91 92" stroke="#3F2E23" stroke-width="1" fill="none" />
  <path d="M109 92 Q112 88 115 92" stroke="#3F2E23" stroke-width="1" fill="none" />

  <!-- Mouth (Added) -->
  <path d="M92 112 Q100 116 108 112" stroke="#3F2E23" stroke-width="1.5" fill="none" opacity="0.6" />

</svg>