<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin_arthur" x1="100" y1="60" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE4C4" />
      <stop offset="1" stop-color="#DEB887" />
    </linearGradient>
    <linearGradient id="suit_arthur" x1="50" y1="130" x2="150" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="hat_arthur" x1="50" y1="30" x2="150" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5563" />
      <stop offset="1" stop-color="#1F2937" />
    </linearGradient>
    <filter id="shadow_arthur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shoulders/Suit -->
  <path d="M40 200 C40 150 60 140 100 140 C140 140 160 150 160 200" fill="url(#suit_arthur)" filter="url(#shadow_arthur)" />
  
  <!-- Shirt/Tie -->
  <path d="M90 140 L100 200 L110 140 L100 155 Z" fill="#F8FAFC" />
  <path d="M100 140 L100 165" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" /> <!-- Tie -->

  <!-- Head -->
  <circle cx="100" cy="95" r="35" fill="url(#skin_arthur)" filter="url(#shadow_arthur)" />
  
  <!-- Beard (Gray/White) -->
  <path d="M75 105 Q100 140 125 105" fill="#E5E7EB" opacity="0.9" />
  <path d="M75 105 Q100 140 125 105" stroke="#D1D5DB" stroke-width="2" fill="none" />

  <!-- Mouth (Hidden in beard but implied) -->
  <path d="M92 115 H108" stroke="#9CA3AF" stroke-width="1.5" opacity="0.6" />

  <!-- Glasses -->
  <g stroke="#374151" stroke-width="2" fill="#FFFFFF" fill-opacity="0.2">
    <circle cx="85" cy="92" r="11" />
    <circle cx="115" cy="92" r="11" />
    <line x1="96" y1="92" x2="104" y2="92" />
  </g>

  <!-- Eyes (Behind glasses) -->
  <circle cx="85" cy="92" r="2.5" fill="#1F2937" />
  <circle cx="115" cy="92" r="2.5" fill="#1F2937" />

  <!-- Hair (Sideburns/Back) -->
  <path d="M62 95 C62 70 70 60 100 60 C130 60 138 70 138 95" fill="none" stroke="#9CA3AF" stroke-width="5" />

  <!-- Hat -->
  <path d="M55 65 L145 65 L135 40 H65 L55 65 Z" fill="url(#hat_arthur)" filter="url(#shadow_arthur)" />
  <rect x="55" y="62" width="90" height="5" fill="#1E293B" /> <!-- Hat Brim -->

  <!-- Book/Folder (Subtle hint at bottom) -->
  <rect x="120" y="170" width="30" height="40" fill="#78350F" transform="rotate(-10 120 170)" />
  <rect x="122" y="172" width="26" height="36" fill="#92400E" transform="rotate(-10 122 172)" />

</svg>