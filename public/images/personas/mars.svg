<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armor_mars" x1="50" y1="50" x2="150" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#991B1B" />
      <stop offset="1" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="metal_mars" x1="70" y1="50" x2="130" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5563" />
      <stop offset="1" stop-color="#1F2937" />
    </linearGradient>
    <filter id="shadow_mars" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cape -->
  <path d="M40 200 L60 140 L140 140 L160 200" fill="#7F1D1D" />

  <!-- Armor Body -->
  <path d="M50 200 C50 150 70 140 100 140 C130 140 150 150 150 200" fill="url(#armor_mars)" filter="url(#shadow_mars)" />
  <path d="M50 200 L70 140 M150 200 L130 140" stroke="#450A0A" stroke-width="2" />

  <!-- Helmet Head -->
  <path d="M65 120 V80 C65 50 80 40 100 40 C120 40 135 50 135 80 V120 H65 Z" fill="url(#metal_mars)" filter="url(#shadow_mars)" />
  
  <!-- Visor Area -->
  <path d="M70 80 H130 V100 L100 115 L70 100 V80 Z" fill="#111827" />
  
  <!-- Glowing Eyes -->
  <path d="M80 88 L95 88 L95 92 L80 92 Z" fill="#EF4444" filter="url(#shadow_mars)" />
  <path d="M105 88 L120 88 L120 92 L105 92 Z" fill="#EF4444" filter="url(#shadow_mars)" />
  
  <!-- Crest -->
  <path d="M96 40 V20 H104 V40" fill="#D97706" />
  <path d="M90 20 H110 L125 55 H75 L90 20 Z" fill="#B45309" opacity="0.9" />

  <!-- Chin/Mouth Guard -->
  <path d="M85 115 L100 125 L115 115 V105 H85 V115 Z" fill="#374151" />
  
  <!-- Scar on Armor -->
  <path d="M60 160 L80 170" stroke="#450A0A" stroke-width="2" opacity="0.5" />

</svg>