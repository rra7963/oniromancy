<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin" x1="100" y1="60" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E8FF" />
      <stop offset="1" stop-color="#E9D5FF" />
    </linearGradient>
    <radialGradient id="robe_main" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 50) rotate(90) scale(150)">
      <stop stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#4C1D95" />
    </radialGradient>
    <linearGradient id="hood_shadow" x1="100" y1="40" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E1065" />
      <stop offset="1" stop-color="#4C1D95" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="eye_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 65) scale(10)">
      <stop stop-color="#FDE047" />
      <stop offset="1" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="100" cy="100" r="85" fill="#7C3AED" fill-opacity="0.1" />
  
  <!-- Shoulders/Body -->
  <path d="M50 200 C50 160 70 140 100 140 C130 140 150 160 150 200" fill="url(#robe_main)" filter="url(#dropShadow)" />
  
  <!-- Neck/Inner Robe -->
  <path d="M85 200 L100 140 L115 200" fill="#2E1065" />

  <!-- Head/Hood Back -->
  <path d="M60 100 C60 50 80 30 100 30 C120 30 140 50 140 100 V120 H60 V100 Z" fill="#5B21B6" />

  <!-- Face -->
  <ellipse cx="100" cy="95" rx="30" ry="35" fill="url(#skin)" filter="url(#dropShadow)" />
  
  <!-- Hood Front/Shadow -->
  <path d="M65 90 C65 55 80 40 100 40 C120 40 135 55 135 90 V110 H65 V90 Z" fill="url(#hood_shadow)" opacity="0.6" />
  
  <!-- Veil (Lowered to reveal mouth area) -->
  <path d="M70 115 Q100 135 130 115 V135 Q100 155 70 135 Z" fill="#8B5CF6" fill-opacity="0.3" />
  
  <!-- Third Eye (Moved Up) -->
  <circle cx="100" cy="65" r="3" fill="#FDE047" filter="url(#dropShadow)" />
  <circle cx="100" cy="65" r="6" fill="url(#eye_glow)" opacity="0.6" />
  
  <!-- Eyes (Closed) -->
  <path d="M85 95 Q90 92 95 95" stroke="#4C1D95" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M105 95 Q110 92 115 95" stroke="#4C1D95" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Mouth (Added) -->
  <path d="M92 110 Q100 113 108 110" stroke="#4C1D95" stroke-width="1.5" fill="none" opacity="0.5" />

</svg>