<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin_orion" x1="100" y1="60" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2F1" />
      <stop offset="1" stop-color="#B2DFDB" />
    </linearGradient>
    <linearGradient id="cloak_orion" x1="50" y1="130" x2="150" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadow_orion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Stars -->
  <circle cx="50" cy="50" r="1" fill="white" />
  <circle cx="150" cy="40" r="1.5" fill="white" />
  <circle cx="180" cy="100" r="1" fill="white" />
  <circle cx="20" cy="120" r="1.5" fill="white" />

  <!-- Cloak -->
  <path d="M40 200 C40 150 60 140 100 140 C140 140 160 150 160 200" fill="url(#cloak_orion)" filter="url(#shadow_orion)" />
  <path d="M90 140 L100 200 L110 140" fill="#334155" />

  <!-- Head -->
  <circle cx="100" cy="90" r="36" fill="url(#skin_orion)" filter="url(#shadow_orion)" />

  <!-- Hair/Hood -->
  <path d="M60 90 C60 50 80 30 100 30 C120 30 140 50 140 90 C140 110 130 120 100 120 C70 120 60 110 60 90" fill="#1E1E2E" opacity="0.8" />
  
  <!-- Star Circlet (Moved Up) -->
  <path d="M65 60 Q100 70 135 60" stroke="#94A3B8" stroke-width="1.5" fill="none" />
  <circle cx="100" cy="65" r="4" fill="#60A5FA" filter="url(#shadow_orion)" />
  
  <!-- Eyes (Glowing) -->
  <circle cx="85" cy="95" r="3" fill="#60A5FA" />
  <circle cx="115" cy="95" r="3" fill="#60A5FA" />
  
  <!-- Constellation Mark -->
  <circle cx="100" cy="45" r="1" fill="#FFFFFF" />
  <circle cx="105" cy="50" r="1" fill="#FFFFFF" />
  <circle cx="95" cy="50" r="1" fill="#FFFFFF" />
  
  <!-- Mouth (Added) -->
  <path d="M92 110 H108" stroke="#60A5FA" stroke-width="1.5" opacity="0.6" />

</svg>