<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050208" />
    <title>Oniromancy AI</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); color: #e9e5f5; background: radial-gradient(circle at 50% 28%, #27184a 0, #0d0818 34%, #050208 70%); text-align: center; }
      main { max-width: 360px; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; display: grid; place-items: center; border: 1px solid rgba(212,175,55,.5); border-radius: 50%; color: #d4af37; box-shadow: 0 0 42px rgba(168,85,247,.2); font-size: 30px; }
      h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 28px; }
      p { margin: 0 0 28px; color: #aaa2b9; line-height: 1.55; }
      button { min-height: 48px; width: 100%; border: 1px solid rgba(212,175,55,.5); border-radius: 14px; color: #0b0711; background: #d4af37; font: 600 16px inherit; }
      button:active { transform: scale(.98); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>The veil is quiet</h1>
      <p>Oniromancy could not reach the oracle. Check your connection and try again.</p>
      <button type="button" onclick="location.href='https://www.oniromancy.com'">Retry</button>
    </main>
  </body>
</html>
